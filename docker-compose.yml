services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    # removed to allow for load balancing scaling with nginx
    # ports:
    #   - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - DB_SERVER=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      - HOST_ADDRESS=${HOST_ADDRESS}
      - SUPER_SECRET=${SUPER_SECRET}
    volumes:
      - ./backend/images:/usr/src/app/images
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
